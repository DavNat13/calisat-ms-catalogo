name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mvn-clean-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # El wrapper se versiono desde Windows (mode 100644). El bit de ejecucion
      # ya se fixeo en git, pero se garantiza de forma defensiva por cualquier
      # re-add futuro del wrapper desde Windows.
      - name: Maven clean verify
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify

  docker-build:
    needs: mvn-clean-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          push: false
          tags: calisat-ms-catalogo:ci

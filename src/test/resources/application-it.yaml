# Profile de tests de integracion (Fase 6). Solo lo consume ProductoCatalogIT via
# Testcontainers; el runtime/produccion NO cambia (sigue application.yaml con
# ddl-auto validate). Los dummies JWT NO son secretos: solo existen para que el
# fail-fast de v1.0.6 (SecurityConfig.validarConfigJwt) deje arrancar el contexto.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/calisat_it
    username: calisat_it
    password: calisat_it
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.test.califorge.local/
          tenant-id: test-tenant

JWT_AUDIENCE: test-audience